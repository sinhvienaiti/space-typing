<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Space Typing — Player shot gallery (dev)</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; color: #dfe9f5; font: 12px/1.4 ui-monospace, Menlo, monospace; overflow: hidden; }
      #bgCanvas { display: none; }
      #view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      #panel { position: absolute; right: 10px; top: 10px; z-index: 2; display: grid; gap: 6px; padding: 10px; background: rgba(6,10,18,.82); border: 1px solid rgba(120,170,230,.2); border-radius: 8px; min-width: 230px; }
      #panel.hidden { display: none; }
      #panel label { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
      #panel select, #panel input { font: inherit; color: inherit; background: #111a28; border: 1px solid #2a3a52; border-radius: 5px; padding: 3px 6px; }
    </style>
  </head>
  <body>
    <canvas id="bgCanvas" aria-hidden="true"></canvas>
    <canvas id="view"></canvas>
    <div id="panel">
      <label>Quality
        <select id="quality">
          <option>low</option><option>medium</option><option selected>high</option><option>ultra</option>
        </select>
      </label>
      <label>Keys / second <input id="cps" type="range" min="1" max="14" step="1" value="8" /></label>
      <label>Time scale <input id="timeScale" type="range" min="0.05" max="1" step="0.05" value="1" /></label>
      <div>H: hide panel</div>
    </div>
    <script type="module" src="/src/vfx/shot-gallery.ts"></script>
  </body>
</html>
