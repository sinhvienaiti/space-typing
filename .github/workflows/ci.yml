name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install
        run: pnpm install --no-frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Audit Warp economy
        run: pnpm stamina:audit

      - name: Audit Missions contract
        run: pnpm missions:audit

      - name: Audit Feature Gates contract
        run: pnpm feature-gates:audit

      - name: Audit Events contract
        run: pnpm events:audit

      - name: Audit Duel contract
        run: pnpm duel:audit

      - name: Audit Ranked contract
        run: pnpm ranked:audit

      - name: Audit Alternative Modes contract
        run: pnpm alternative-modes:audit

      - name: Audit Backgrounds contract
        run: pnpm backgrounds:audit

      - name: Audit VFX contract
        run: pnpm vfx:audit

      - name: Audit UI Assets contract
        run: pnpm ui-assets:audit

      - name: Build
        run: pnpm build
