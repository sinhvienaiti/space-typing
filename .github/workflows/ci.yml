name: Offline Source Export

on:
  push:
    branches:
      - automation/offline-source-export

jobs:
  export-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact Space Typing source
        uses: actions/checkout@v4
        with:
          ref: 35948ff707559ccec518fea656041399e35c7a8b
          path: source
          fetch-depth: 1

      - name: Prepare offline source package
        run: |
          rm -rf source/.git
          cat > source/OFFLINE_EXPORT_INFO.txt <<'EOF'
          Repository: sinhvienaiti/space-typing
          Branch source: main
          Commit: 35948ff707559ccec518fea656041399e35c7a8b
          Commit message: Replace static size limits with code-quality and runtime rules
          Export purpose: offline transfer to Mac mini
          EOF

      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: space-typing-35948ff7-source
          path: source
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 6
