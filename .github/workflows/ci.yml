name: Offline Source Export

on:
  push:
    branches:
      - automation/offline-source-export

jobs:
  export-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact Space Typing source
        uses: actions/checkout@v4
        with:
          ref: a5a50ea5386e788ea4f99beef610952ae2db9290
          path: source
          fetch-depth: 1

      - name: Prepare offline source package
        run: |
          rm -rf source/.git
          cat > source/OFFLINE_EXPORT_INFO.txt <<'EOF'
          Repository: sinhvienaiti/space-typing
          Branch source: main
          Commit: a5a50ea5386e788ea4f99beef610952ae2db9290
          Commit message: Darken Recall orb and match classic silhouette
          Export purpose: offline transfer to Mac mini
          EOF

      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: space-typing-a5a50ea5-source
          path: source
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 6
