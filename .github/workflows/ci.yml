name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install
        run: pnpm install --no-frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Audit Warp economy
        run: pnpm stamina:audit

      - name: Audit Missions contract
        run: pnpm missions:audit

      - name: Audit Feature Gates contract
        run: pnpm feature-gates:audit

      - name: Audit Events contract
        run: pnpm events:audit

      - name: Audit Duel contract
        run: pnpm duel:audit

      - name: Audit Ranked contract
        run: pnpm ranked:audit

      - name: Audit Alternative Modes contract
        run: pnpm alternative-modes:audit

      - name: Audit Backgrounds contract
        run: pnpm backgrounds:audit

      - name: Build prepare local art
        run: pnpm run prebuild

      - name: Build asset preflight
        run: |
          node scripts/check-audio-assets.mjs
          node scripts/check-background-assets.mjs
          node scripts/bg-art/check-expansion-v2.mjs
          node scripts/bg-art/check-credit-puzzle-art.mjs

      - name: Diagnose TypeScript src
        run: |
          node -e "const fs=require('fs'); const c=JSON.parse(fs.readFileSync('tsconfig.json','utf8')); c.include=['src']; fs.writeFileSync('tsconfig.ci-src.json', JSON.stringify(c));"
          pnpm exec tsc -p tsconfig.ci-src.json --noEmit

      - name: Diagnose TypeScript tests
        run: |
          node -e "const fs=require('fs'); const c=JSON.parse(fs.readFileSync('tsconfig.json','utf8')); c.include=['tests']; fs.writeFileSync('tsconfig.ci-tests.json', JSON.stringify(c));"
          pnpm exec tsc -p tsconfig.ci-tests.json --noEmit

      - name: Diagnose TypeScript Vite config
        run: |
          node -e "const fs=require('fs'); const c=JSON.parse(fs.readFileSync('tsconfig.json','utf8')); c.include=['vite.config.ts']; fs.writeFileSync('tsconfig.ci-vite.json', JSON.stringify(c));"
          pnpm exec tsc -p tsconfig.ci-vite.json --noEmit

      - name: Build TypeScript app
        run: tsc -p tsconfig.json --noEmit

      - name: Build TypeScript server
        run: tsc -p tsconfig.server.json --noEmit

      - name: Build Vite
        run: vite build

      - name: Build postflight
        run: |
          node scripts/report-bundle-metrics.mjs
          node scripts/check-ship-art-integrity.mjs
          node scripts/check-background-art.mjs
