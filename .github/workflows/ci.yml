name: Offline Source Export

on:
  push:
    branches:
      - automation/offline-source-export

jobs:
  export-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact Space Typing source
        uses: actions/checkout@v4
        with:
          ref: 6efa9ce231d1a43e20686db33defbf5839912916
          path: source
          fetch-depth: 1

      - name: Prepare offline source package
        run: |
          rm -rf source/.git
          cat > source/OFFLINE_EXPORT_INFO.txt <<'EOF'
          Repository: sinhvienaiti/space-typing
          Branch source: main
          Commit: 6efa9ce231d1a43e20686db33defbf5839912916
          Commit message: Polish learning rail, icons, help tooltips and kill feedback
          Export purpose: offline transfer to Mac mini
          EOF

      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: space-typing-6efa9ce2-source
          path: source
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 6
