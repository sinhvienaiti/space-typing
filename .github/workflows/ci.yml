name: Offline Source Export

on:
  push:
    branches:
      - automation/offline-source-export

jobs:
  export-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact Space Typing source
        uses: actions/checkout@v4
        with:
          ref: b1c17652224e2efa0f433768a96c5f1267028aa7
          path: source
          fetch-depth: 1

      - name: Prepare offline source package
        run: |
          rm -rf source/.git
          cat > source/OFFLINE_EXPORT_INFO.txt <<'EOF'
          Repository: sinhvienaiti/space-typing
          Branch source: main
          Commit: b1c17652224e2efa0f433768a96c5f1267028aa7
          Commit message: Center and brighten classic Recall memory eyes
          Export purpose: offline transfer to Mac mini
          EOF

      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: space-typing-b1c17652-source
          path: source
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 6
