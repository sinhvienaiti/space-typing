name: Offline Source Export

on:
  push:
    branches:
      - automation/offline-source-export

jobs:
  export-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact Space Typing source
        uses: actions/checkout@v4
        with:
          ref: 8209d54d33b416af51bd4abf8e2fb89eec08b0de
          path: source
          fetch-depth: 1

      - name: Prepare offline source package
        run: |
          rm -rf source/.git
          cat > source/OFFLINE_EXPORT_INFO.txt <<'EOF'
          Repository: sinhvienaiti/space-typing
          Branch source: main
          Commit: 8209d54d33b416af51bd4abf8e2fb89eec08b0de
          Commit message: Match Recall reference visual and correct text state colors
          Export purpose: offline transfer to Mac mini
          EOF

      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: space-typing-8209d54d-source
          path: source
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 6
