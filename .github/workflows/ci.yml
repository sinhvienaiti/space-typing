name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install
        run: pnpm install --no-frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: R01 browser QA
        run: pnpm visual:r01-qa

      - name: Upload R01 browser captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r01-campaign-map-${{ github.run_id }}
          path: |
            .visual/r01-desktop.png
            .visual/r01-mobile.png
            .visual/r01-vite.log
          if-no-files-found: warn
          retention-days: 7
