name: Offline Source Export

on:
  push:
    branches:
      - automation/offline-source-export

jobs:
  export-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact Space Typing source
        uses: actions/checkout@v4
        with:
          ref: 784986d7d6a96624170ea102ca13ae6f466ee9b3
          path: source
          fetch-depth: 1

      - name: Prepare offline source package
        run: |
          rm -rf source/.git
          cat > source/OFFLINE_EXPORT_INFO.txt <<'EOF'
          Repository: sinhvienaiti/space-typing
          Branch source: main
          Commit: 784986d7d6a96624170ea102ca13ae6f466ee9b3
          Commit message: Dock Recall assist controls to screen edge
          Export purpose: offline transfer to Mac mini
          EOF

      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: space-typing-784986d7-source
          path: source
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 6
