name: Assistant Apply B1 Catalog Playback

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  catalog-playback:
    if: github.actor != 'github-actions[bot]' && github.event.pull_request.head.ref == 'feat/audio-a1-pronunciation-audibility'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install
        run: pnpm install --no-frozen-lockfile
      - name: Apply guarded B1 catalog playback patch
        run: python scripts/assistant/apply-b1-catalog-playback.py
      - name: Full tests
        run: pnpm test
      - name: Type check
        run: pnpm exec tsc -p tsconfig.json --noEmit
      - name: Build
        run: pnpm run build
      - name: Diff safety
        run: git diff --check
      - name: Commit verified B1 catalog playback
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/audio/music-profile.ts src/audio/world-music-runtime.ts src/audio/MusicController.ts tests/world-music-runtime.test.ts tests/music-catalog-playback.test.ts
          if git diff --cached --quiet; then
            echo "No production/test changes to commit"
            exit 0
          fi
          git commit -m "feat(music): support catalog single-file playback"
          git pull --rebase origin ${{ github.event.pull_request.head.ref }}
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
