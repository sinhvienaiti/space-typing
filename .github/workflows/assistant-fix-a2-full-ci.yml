name: Assistant Fix A2 Full CI

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]' && github.event.pull_request.head.ref == 'feat/audio-a1-pronunciation-audibility'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install
        run: pnpm install --no-frozen-lockfile
      - name: Apply guarded compatibility patch
        run: python scripts/assistant/fix-a2-full-ci.py
      - name: Former full-suite failures
        run: pnpm exec vitest run tests/combat-credit-game-integration.test.ts tests/test-lab-game.test.ts tests/sfx-lifecycle.test.ts tests/audio-focus-manager.test.ts tests/pronunciation-mix-focus.test.ts
      - name: Type check
        run: pnpm exec tsc -p tsconfig.json --noEmit
      - name: Diff safety
        run: git diff --check
      - name: Commit verified compatibility fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/audio/Sfx.ts tests/sfx-lifecycle.test.ts
          if git diff --cached --quiet; then
            echo "No compatibility changes to commit"
            exit 0
          fi
          git commit -m "fix(audio): tolerate minimal QA audio contexts"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
