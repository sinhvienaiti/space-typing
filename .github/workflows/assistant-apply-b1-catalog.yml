name: Assistant Apply B1 Catalog

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  catalog:
    if: github.actor != 'github-actions[bot]' && github.event.pull_request.head.ref == 'feat/audio-a1-pronunciation-audibility'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install
        run: pnpm install --no-frozen-lockfile
      - name: Generate deterministic World music catalog
        run: node scripts/music/build-world-music-catalog.mjs
      - name: Verify generator is stable
        run: node scripts/music/build-world-music-catalog.mjs --check
      - name: B1 model tests
        run: pnpm exec vitest run tests/world-music-model.test.ts tests/music-library.test.ts tests/music-controller.test.ts tests/music-profile.test.ts
      - name: Type check
        run: pnpm exec tsc -p tsconfig.json --noEmit
      - name: Diff safety
        run: git diff --check
      - name: Commit verified generated catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/audio/world-music-catalog.json
          if git diff --cached --quiet; then
            echo "Catalog already current"
            exit 0
          fi
          git commit -m "feat(music): generate deterministic World catalog"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
