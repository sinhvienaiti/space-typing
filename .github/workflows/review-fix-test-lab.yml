name: Review Test Lab cleanup applier

on:
  push:
    branches:
      - feat/audio-a1-pronunciation-audibility
    paths:
      - 'review-fixes/test-lab-cleanup.mjs'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply reviewed transform
        run: node review-fixes/test-lab-cleanup.mjs
      - name: Commit source and remove one-shot tooling
        shell: bash
        run: |
          set -euo pipefail
          rm -f review-fixes/test-lab-cleanup.mjs .github/workflows/review-fix-test-lab.yml
          rmdir review-fixes 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(test-lab): clean transient audio focus lifecycle'
          git push origin HEAD:"$GITHUB_REF_NAME"
