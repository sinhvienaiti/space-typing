name: Assistant Apply A3

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]' && github.event.pull_request.head.ref == 'feat/audio-a1-pronunciation-audibility'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install
        run: pnpm install --no-frozen-lockfile
      - name: Apply guarded A3 patch
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/assistant/apply-a3-audio-settings.py')
          text = p.read_text()
          anchor = """def write_new(path: str, content: str) -> None:\n"""
          helper = """def replace_first(path: str, old: str, new: str) -> None:\n    p = ROOT / path\n    text = p.read_text()\n    if old not in text:\n        raise SystemExit(f\"{path}: first-match anchor missing for {old[:120]!r}\")\n    p.write_text(text.replace(old, new, 1))\n\n\n"""
          if anchor not in text:
              raise SystemExit('A3 helper insertion anchor missing')
          text = text.replace(anchor, helper + anchor, 1)

          call = """replace_once(\n    'src/audio/Sfx.ts',\n    '''    this.applyGroupBusGains();\\n    this.samples.setMix(this.volume, this.pronunciationActive);\\n''',\n"""
          replacement = call.replace('replace_once(', 'replace_first(', 1)
          if call not in text:
              raise SystemExit('A3 Sfx focus anchor call missing')
          text = text.replace(call, replacement, 1)

          # A2 already routes CreditSoundEngine through groupOutput(..., "rewards").
          # Do not patch level() again here or category/master gain would be applied twice.
          credit_block = """# Credit engine reads level lazily; route it through the same real Rewards bus preference.\nreplace_once(\n    'src/audio/Sfx.ts',\n    '''              this.volume,\\n              \"rewards\",\\n              gain,\\n              this.pronunciationActive,\\n            ) * this.creditVolume,\\n''',\n    '''              this.effectiveSfxVolume(),\\n              \"rewards\",\\n              gain,\\n              this.pronunciationActive,\\n              this.groupPreferences.rewards,\\n            ) * this.creditVolume,\\n''',\n)\n\n"""
          if credit_block not in text:
              raise SystemExit('A3 obsolete credit block missing')
          text = text.replace(credit_block, '', 1)
          p.write_text(text)
          PY
          python scripts/assistant/apply-a3-audio-settings.py
      - name: A3 focused tests
        run: pnpm exec vitest run tests/player-audio-settings.test.ts tests/audio-settings-ui-contract.test.ts tests/audio-mix.test.ts tests/sample-sfx-bank.test.ts tests/pronunciation-mix-focus.test.ts tests/announcer-sfx.test.ts tests/sfx-lifecycle.test.ts tests/duel-audio.test.ts tests/title-hub.test.ts
      - name: Type check
        run: pnpm exec tsc -p tsconfig.json --noEmit
      - name: Diff safety
        run: git diff --check
      - name: Commit verified A3 production changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html src/types.ts src/audio/player-settings.ts src/audio/mix.ts src/audio/sample-bank.ts src/audio/Sfx.ts src/Game.ts src/speech.ts src/main.ts src/ui/title-hub.ts src/ui/audio-settings.css tests/player-audio-settings.test.ts tests/audio-settings-ui-contract.test.ts
          if git diff --cached --quiet; then
            echo "No A3 changes to commit"
            exit 0
          fi
          git commit -m "feat(audio): add quick and advanced player mix controls"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
