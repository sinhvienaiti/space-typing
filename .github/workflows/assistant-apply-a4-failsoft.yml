name: Assistant Apply A4 Failsoft

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]' && github.event.pull_request.head.ref == 'feat/audio-a1-pronunciation-audibility'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install
        run: pnpm install --no-frozen-lockfile
      - name: Apply guarded fail-soft patch
        run: python scripts/assistant/apply-a4-failsoft.py
      - name: Regression tests
        run: pnpm exec vitest run tests/sfx-web-audio-failsoft.test.ts tests/projectile-intercept-sfx.test.ts tests/a4-audio-production-path.test.ts tests/sfx-lifecycle.test.ts tests/sample-sfx-bank.test.ts
      - name: Type check
        run: pnpm exec tsc -p tsconfig.json --noEmit
      - name: Diff safety
        run: git diff --check
      - name: Commit verified patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/audio/Sfx.ts
          if git diff --cached --quiet; then
            echo "No production changes to commit"
            exit 0
          fi
          git commit -m "fix(audio): keep sampled SFX fail-soft without WebAudio"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
