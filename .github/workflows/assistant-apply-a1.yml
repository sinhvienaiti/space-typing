name: Assistant Apply A1

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]' && github.event.pull_request.head.ref == 'feat/audio-a1-pronunciation-audibility'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install
        run: pnpm install --no-frozen-lockfile

      - name: Apply guarded focus patch
        run: python scripts/assistant/apply-a1-focus.py

      - name: Focus regression tests
        run: pnpm exec vitest run tests/speech-focus.test.ts tests/pronunciation-mix-focus.test.ts tests/music-controller.test.ts tests/m22-audio-audit.test.ts tests/announcer-sfx.test.ts tests/sfx-lifecycle.test.ts

      - name: Type check
        run: pnpm exec tsc -p tsconfig.json --noEmit

      - name: Diff safety
        run: git diff --check

      - name: Commit verified patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/audio/MusicController.ts src/audio/Sfx.ts
          if git diff --cached --quiet; then
            echo "No production changes to commit"
            exit 0
          fi
          git commit -m "fix(audio): prioritize pronunciation across music and announcer"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
