name: Assistant Source Snapshot

on:
  pull_request:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: assistant-source-${{ github.event.pull_request.head.sha }}
          path: |
            src
            tests
            server
            scripts
            docs
            package.json
            pnpm-lock.yaml
            tsconfig.json
            tsconfig.server.json
            vite.config.ts
          if-no-files-found: error
          retention-days: 1
