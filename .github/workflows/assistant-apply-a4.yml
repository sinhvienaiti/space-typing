name: Assistant Apply A4

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]' && github.event.pull_request.head.ref == 'feat/audio-a1-pronunciation-audibility'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install
        run: pnpm install --no-frozen-lockfile

      - name: Apply guarded A4 patch
        run: python scripts/assistant/apply-a4-audio-qa.py

      - name: A4 focused regression tests
        run: pnpm exec vitest run tests/a4-audio-production-path.test.ts tests/speech-focus.test.ts tests/pronunciation-mix-focus.test.ts tests/player-audio-settings.test.ts tests/audio-focus-manager.test.ts tests/m22-audio-audit.test.ts

      - name: Type check
        run: pnpm exec tsc -p tsconfig.json --noEmit

      - name: Production pronunciation path audit
        run: |
          grep -R -n "speakEnglish" src/main.ts src/test-lab/controller.ts src/speech.ts
          ! grep -n -A4 'this.samples.play(' src/audio/Sfx.ts | grep 'this.volume'

      - name: Diff safety
        run: git diff --check

      - name: Commit verified A4 patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/audio/Sfx.ts src/test-lab/controller.ts
          if git diff --cached --quiet; then
            echo "No production changes to commit"
            exit 0
          fi
          git commit -m "fix(audio): harden A4 pronunciation production QA"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
