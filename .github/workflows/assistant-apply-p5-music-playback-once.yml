name: Assistant Apply P5 Music Playback Once

on:
  push:
    branches:
      - feat/bgv-integration-current

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/bgv-integration-current
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install
        run: pnpm install --no-frozen-lockfile

      - name: Apply guarded P5 playback lifecycle patch
        run: python scripts/assistant/apply-p5-music-playback-once.py

      - name: Focused playback regressions
        run: pnpm exec vitest run tests/music-playback-failure.test.ts tests/music-controller-failure-taxonomy.test.ts tests/music-controller.test.ts tests/music-library.test.ts

      - name: Type check
        run: pnpm exec tsc -p tsconfig.json --noEmit

      - name: Diff safety
        run: git diff --check

      - name: Commit verified P5 playback lifecycle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/audio/MusicController.ts src/audio/music-playback-failure.ts tests/music-playback-failure.test.ts tests/music-controller-failure-taxonomy.test.ts
          git rm .github/workflows/assistant-apply-p5-music-playback-once.yml scripts/assistant/apply-p5-music-playback-once.py
          git commit -m "fix(audio): fence stale music playback failures"
          git push origin HEAD:feat/bgv-integration-current
