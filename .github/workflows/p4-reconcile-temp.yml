name: P4 English reconciliation helper

on:
  push:
    branches:
      - tmp/p4-english-reconcile-20261012
    paths:
      - .github/workflows/p4-reconcile-temp.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Correct whitespace normalization escape
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path("src/learning/shared.ts")
          text = path.read_text()
          old = r'/\\s+/g'
          new = r'/\s+/g'
          count = text.count(old)
          if count != 2:
              raise SystemExit(f"expected exactly two over-escaped regexes, found {count}")
          path.write_text(text.replace(old, new))
          PY
          git diff --check
          test "$(git diff --name-only)" = "src/learning/shared.ts"
      - name: Commit corrected shared-learning parser
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/learning/shared.ts
          git commit -m "fix(learning): normalize rich English whitespace"
          git push origin HEAD:"$GITHUB_REF_NAME"
