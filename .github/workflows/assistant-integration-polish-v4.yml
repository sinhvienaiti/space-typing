name: Assistant integration polish v4

on:
  push:
    branches:
      - feat/bgv-integration-current

permissions:
  contents: write

concurrency:
  group: assistant-integration-polish-v4
  cancel-in-progress: false

jobs:
  polish:
    if: contains(github.event.head_commit.message, '[integration-v4]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/bgv-integration-current
          fetch-depth: 0
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.21.0 --activate
      - name: Apply guarded patch
        run: python3 scripts/assistant-integration-polish.py
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test
        run: pnpm test
      - name: Typecheck
        run: pnpm exec tsc --noEmit
      - name: Build
        run: pnpm build
      - name: Commit validated source and cleanup helpers
        shell: bash
        run: |
          git config user.name "OpenAI integration worker"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/assistant-integration-polish.yml
          git rm .github/workflows/assistant-integration-polish-v2.yml
          git rm .github/workflows/assistant-integration-polish-v3.yml
          git rm .github/workflows/assistant-integration-polish-v4.yml
          git rm scripts/assistant-integration-polish.py
          git add src index.html tests
          git commit -m "fix(integration): polish expedition warp briefing and audio"
          git push origin HEAD:feat/bgv-integration-current
