name: R04 Voice Acceptance Patch

on:
  push:

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact R04 runtime patch
        run: python3 scripts/r04-temp-patch.py
      - name: Validate patch
        run: git diff --check
      - name: Commit patched runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/input/voice-session.ts src/duel/online-room-controller.ts src/main.ts tests/voice-session.test.ts
          git diff --cached --quiet && exit 0
          git commit -m "feat(voice): lock final acceptance runtime"
          git push origin HEAD
