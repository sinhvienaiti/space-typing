name: Assistant Apply B2 World Music Pilot

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  b2-pilot:
    if: github.actor != 'github-actions[bot]' && github.event.pull_request.head.ref == 'feat/audio-a1-pronunciation-audibility'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install
        run: pnpm install --no-frozen-lockfile
      - name: Apply guarded B2 pilot patch
        run: python scripts/assistant/apply-b2-world-music-pilot.py
      - name: Generate deterministic World music catalog
        run: |
          pnpm music:catalog
          cp src/audio/world-music-catalog.json /tmp/world-music-catalog.json
          pnpm music:catalog
          cmp -s src/audio/world-music-catalog.json /tmp/world-music-catalog.json
      - name: Full tests
        run: pnpm test
      - name: Type check
        run: pnpm exec tsc -p tsconfig.json --noEmit
      - name: Build
        run: pnpm run build
      - name: Diff safety
        run: git diff --check
      - name: Commit verified B2 pilot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json \
            src/audio/world-music-default-policy.ts \
            src/audio/world-music-catalog.json \
            public/assets/audio/music/worlds/world-10/boss/battle-theme-b/track.json \
            tests/world-music-default-policy.test.ts \
            tests/world-music-b2-pilot.test.ts
          if git diff --cached --quiet; then
            echo "No production/test changes to commit"
            exit 0
          fi
          git commit -m "feat(music): migrate three-World pilot"
          git pull --rebase origin ${{ github.event.pull_request.head.ref }}
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
