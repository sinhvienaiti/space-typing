name: R01 hidden arrival patch

on:
  push:
    branches:
      - feat/bgv-integration-current

permissions:
  contents: write

jobs:
  patch-test-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/bgv-integration-current
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install
        run: pnpm install --no-frozen-lockfile

      - name: Patch automatic hidden-stop arrival flow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/ui/secret-route-map.ts")
          text = path.read_text()

          if "export function hiddenStopArrivalCanPresent(" not in text:
              marker = "\nfunction byId<T extends HTMLElement>"
              index = text.index(marker)
              helper = '''

          export function hiddenStopArrivalCanPresent(
            stageCleared: boolean,
            checkpointHubOpen: boolean,
          ): boolean {
            return stageCleared && !checkpointHubOpen;
          }
          '''
              text = text[:index] + helper.rstrip() + text[index:]

          function_start = text.index("function renderHiddenStopArrival(")
          panel_start = text.index('  const panel = root.createElement("section");', function_start)
          new_head = '''function renderHiddenStopArrival(
            root: Document,
            arrival: HiddenStopArrival,
            onDismiss: () => void,
          ): void {
            const dialog = byId<HTMLDialogElement>(root, "stageSelectDialog");
            const restHubDialog = byId<HTMLDialogElement>(root, "restHubDialog");
            const grid = byId(root, "stageGrid");
            const parent = grid?.parentElement ?? null;
            if (
              dialog === null ||
              grid === null ||
              parent === null ||
              !hiddenStopArrivalCanPresent(
                hiddenStopStageIsCleared(root, arrival),
                restHubDialog?.open === true,
              )
            ) {
              return;
            }

            if (!dialog.open) {
              if (typeof dialog.showModal === "function") {
                dialog.showModal();
              } else {
                dialog.setAttribute("open", "");
              }
            }
            clearSecretArrival(root);

          '''
          text = text[:function_start] + new_head + text[panel_start:]

          arrival_start = text.index("  const onArrival = (event: Event) => {")
          click_start = text.index("  const onClick = (event: Event) => {", arrival_start)
          new_arrival = '''  const onArrival = (event: Event) => {
            const detail = (event as CustomEvent<unknown>).detail;
            if (!isHiddenStopArrival(detail)) return;
            pendingArrival = detail;
            renderMap();
          };
          '''
          text = text[:arrival_start] + new_arrival + text[click_start:]

          if "const onRestHubClose = () => renderMap();" not in text:
              event_marker = "  window.addEventListener(HIDDEN_DISCOVERY_PRESENTATION_EVENT, onDiscovery);"
              index = text.index(event_marker)
              listeners = '''  const restHubDialog = byId<HTMLDialogElement>(root, "restHubDialog");
            const stageSelectDialog = byId<HTMLDialogElement>(root, "stageSelectDialog");
            const onRestHubClose = () => renderMap();
            const onStageSelectClose = () => {
              if (
                pendingArrival !== null &&
                byId(root, SECRET_ARRIVAL_ID) !== null
              ) {
                pendingArrival = null;
                clearSecretArrival(root);
              }
            };

          '''
              text = text[:index] + listeners + text[index:]
              text = text.replace(
                  '  window.addEventListener(HIDDEN_STOP_ARRIVAL_EVENT, onArrival);\n',
                  '  window.addEventListener(HIDDEN_STOP_ARRIVAL_EVENT, onArrival);\n'
                  '  restHubDialog?.addEventListener("close", onRestHubClose);\n'
                  '  stageSelectDialog?.addEventListener("close", onStageSelectClose);\n',
                  1,
              )

          if 'restHubDialog?.removeEventListener("close", onRestHubClose);' not in text:
              text = text.replace(
                  '    window.removeEventListener(HIDDEN_STOP_ARRIVAL_EVENT, onArrival);\n',
                  '    window.removeEventListener(HIDDEN_STOP_ARRIVAL_EVENT, onArrival);\n'
                  '    restHubDialog?.removeEventListener("close", onRestHubClose);\n'
                  '    stageSelectDialog?.removeEventListener("close", onStageSelectClose);\n',
                  1,
              )

          path.write_text(text)
          PY

      - name: Add hidden-arrival ordering regression coverage
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/secret-route.test.ts")
          text = path.read_text()
          if "hiddenStopArrivalCanPresent," not in text:
              old = '''  hiddenStopArrivalButtonId,
          } from "../src/ui/secret-route-map";'''
              new = '''  hiddenStopArrivalButtonId,
            hiddenStopArrivalCanPresent,
          } from "../src/ui/secret-route-map";'''
              assert old in text
              text = text.replace(old, new, 1)

          title = "presents hidden-stop arrival only after clear and after checkpoint hub"
          if title not in text:
              anchor = '  it("does not replay a hidden-stop arrival while hydrating an existing save", () => {'
              assert anchor in text
              test = '''  it("presents hidden-stop arrival only after clear and after checkpoint hub", () => {
            expect(hiddenStopArrivalCanPresent(false, false)).toBe(false);
            expect(hiddenStopArrivalCanPresent(true, true)).toBe(false);
            expect(hiddenStopArrivalCanPresent(true, false)).toBe(true);
          });

          '''
              text = text.replace(anchor, test + anchor, 1)
          path.write_text(text)
          PY

      - name: Check patch diff
        run: |
          git diff --check
          git diff -- src/ui/secret-route-map.ts tests/secret-route.test.ts
      - name: Targeted R01 test
        run: pnpm exec vitest run tests/secret-route.test.ts tests/hidden-discovery-timing.test.ts
      - name: Full test
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Commit and push R01 hidden-arrival fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ui/secret-route-map.ts tests/secret-route.test.ts
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "feat(campaign): auto-present hidden stop arrivals"
          git push origin HEAD:feat/bgv-integration-current
