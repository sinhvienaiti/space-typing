name: R01 hidden arrival patch

on:
  push:
    branches:
      - feat/bgv-integration-current

permissions:
  contents: write

jobs:
  patch-test-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/bgv-integration-current
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install
        run: pnpm install --no-frozen-lockfile

      - name: Patch automatic hidden-stop arrival flow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/ui/secret-route-map.ts")
          text = path.read_text()

          helper_anchor = '''export function hiddenStopArrivalButtonId(
            arrival: HiddenStopArrival,
          ): "blackMarketButton" | "stationShopButton" {
            return arrival.kind === "hidden-station"
              ? "stationShopButton"
              : "blackMarketButton";
          }
          '''
          helper_block = helper_anchor + '''
          export function hiddenStopArrivalCanPresent(
            stageCleared: boolean,
            checkpointHubOpen: boolean,
          ): boolean {
            return stageCleared && !checkpointHubOpen;
          }
          '''
          if "export function hiddenStopArrivalCanPresent(" not in text:
              assert text.count(helper_anchor) == 1
              text = text.replace(helper_anchor, helper_block, 1)

          old_render_head = '''function renderHiddenStopArrival(
            root: Document,
            arrival: HiddenStopArrival,
            onDismiss: () => void,
          ): void {
            clearSecretArrival(root);
            const dialog = byId<HTMLDialogElement>(root, "stageSelectDialog");
            const grid = byId(root, "stageGrid");
            const parent = grid?.parentElement ?? null;
            if (
              dialog?.open !== true ||
              grid === null ||
              parent === null ||
              !hiddenStopStageIsCleared(root, arrival)
            ) {
              return;
            }
          '''
          new_render_head = '''function renderHiddenStopArrival(
            root: Document,
            arrival: HiddenStopArrival,
            onDismiss: () => void,
          ): void {
            const dialog = byId<HTMLDialogElement>(root, "stageSelectDialog");
            const restHubDialog = byId<HTMLDialogElement>(root, "restHubDialog");
            const grid = byId(root, "stageGrid");
            const parent = grid?.parentElement ?? null;
            if (
              dialog === null ||
              grid === null ||
              parent === null ||
              !hiddenStopArrivalCanPresent(
                hiddenStopStageIsCleared(root, arrival),
                restHubDialog?.open === true,
              )
            ) {
              return;
            }

            if (!dialog.open) {
              if (typeof dialog.showModal === "function") {
                dialog.showModal();
              } else {
                dialog.setAttribute("open", "");
              }
            }
            clearSecretArrival(root);
          '''
          if old_render_head in text:
              text = text.replace(old_render_head, new_render_head, 1)
          else:
              assert new_render_head in text

          old_arrival = '''  const onArrival = (event: Event) => {
            const detail = (event as CustomEvent<unknown>).detail;
            if (isHiddenStopArrival(detail)) pendingArrival = detail;
          };
          '''
          new_arrival = '''  const onArrival = (event: Event) => {
            const detail = (event as CustomEvent<unknown>).detail;
            if (!isHiddenStopArrival(detail)) return;
            pendingArrival = detail;
            renderMap();
          };
          '''
          if old_arrival in text:
              text = text.replace(old_arrival, new_arrival, 1)
          else:
              assert new_arrival in text

          listener_anchor = '''  window.addEventListener(HIDDEN_DISCOVERY_PRESENTATION_EVENT, onDiscovery);
            window.addEventListener(HIDDEN_STOP_ARRIVAL_EVENT, onArrival);
            root.addEventListener("click", onClick);
            renderMap();
          '''
          listener_block = '''  const restHubDialog = byId<HTMLDialogElement>(root, "restHubDialog");
            const stageSelectDialog = byId<HTMLDialogElement>(root, "stageSelectDialog");
            const onRestHubClose = () => renderMap();
            const onStageSelectClose = () => {
              if (
                pendingArrival !== null &&
                byId(root, SECRET_ARRIVAL_ID) !== null
              ) {
                pendingArrival = null;
                clearSecretArrival(root);
              }
            };

            window.addEventListener(HIDDEN_DISCOVERY_PRESENTATION_EVENT, onDiscovery);
            window.addEventListener(HIDDEN_STOP_ARRIVAL_EVENT, onArrival);
            restHubDialog?.addEventListener("close", onRestHubClose);
            stageSelectDialog?.addEventListener("close", onStageSelectClose);
            root.addEventListener("click", onClick);
            renderMap();
          '''
          if "const onRestHubClose = () => renderMap();" not in text:
              assert text.count(listener_anchor) == 1
              text = text.replace(listener_anchor, listener_block, 1)

          cleanup_anchor = '''    window.removeEventListener(HIDDEN_DISCOVERY_PRESENTATION_EVENT, onDiscovery);
              window.removeEventListener(HIDDEN_STOP_ARRIVAL_EVENT, onArrival);
              root.removeEventListener("click", onClick);
          '''
          cleanup_block = '''    window.removeEventListener(HIDDEN_DISCOVERY_PRESENTATION_EVENT, onDiscovery);
              window.removeEventListener(HIDDEN_STOP_ARRIVAL_EVENT, onArrival);
              restHubDialog?.removeEventListener("close", onRestHubClose);
              stageSelectDialog?.removeEventListener("close", onStageSelectClose);
              root.removeEventListener("click", onClick);
          '''
          if "restHubDialog?.removeEventListener(\"close\", onRestHubClose);" not in text:
              assert text.count(cleanup_anchor) == 1
              text = text.replace(cleanup_anchor, cleanup_block, 1)

          path.write_text(text)
          PY

      - name: Add hidden-arrival ordering regression coverage
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/secret-route.test.ts")
          text = path.read_text()
          old_import = '''  activateSecretRoutePresentation,
            hiddenStopArrivalButtonId,
          } from "../src/ui/secret-route-map";
          '''
          new_import = '''  activateSecretRoutePresentation,
            hiddenStopArrivalButtonId,
            hiddenStopArrivalCanPresent,
          } from "../src/ui/secret-route-map";
          '''
          if "hiddenStopArrivalCanPresent," not in text:
              assert text.count(old_import) == 1
              text = text.replace(old_import, new_import, 1)

          anchor = '''  it("does not replay a hidden-stop arrival while hydrating an existing save", () => {
          '''
          test = '''  it("presents hidden-stop arrival only after clear and after checkpoint hub", () => {
            expect(hiddenStopArrivalCanPresent(false, false)).toBe(false);
            expect(hiddenStopArrivalCanPresent(true, true)).toBe(false);
            expect(hiddenStopArrivalCanPresent(true, false)).toBe(true);
          });

          '''
          if "presents hidden-stop arrival only after clear and after checkpoint hub" not in text:
              assert text.count(anchor) == 1
              text = text.replace(anchor, test + anchor, 1)

          path.write_text(text)
          PY

      - name: Check patch diff
        run: |
          git diff --check
          git diff -- src/ui/secret-route-map.ts tests/secret-route.test.ts

      - name: Targeted R01 test
        run: pnpm exec vitest run tests/secret-route.test.ts tests/hidden-discovery-timing.test.ts

      - name: Full test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Commit and push R01 hidden-arrival fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ui/secret-route-map.ts tests/secret-route.test.ts
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "feat(campaign): auto-present hidden stop arrivals"
          git push origin HEAD:feat/bgv-integration-current
