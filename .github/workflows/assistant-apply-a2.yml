name: Assistant Apply A2

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]' && github.event.pull_request.head.ref == 'feat/audio-a1-pronunciation-audibility'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install
        run: pnpm install --no-frozen-lockfile
      - name: Apply guarded A2 runtime patch
        run: |
          bash scripts/assistant/apply-a2-runtime.sh
          python scripts/assistant/fix-a2-gate.py
      - name: A2 regression tests
        run: pnpm exec vitest run tests/audio-focus-manager.test.ts tests/speech-focus.test.ts tests/pronunciation-mix-focus.test.ts tests/music-controller.test.ts tests/m22-audio-audit.test.ts tests/announcer-sfx.test.ts tests/sample-sfx-bank.test.ts tests/sfx-lifecycle.test.ts tests/test-lab-production-qa.test.ts
      - name: Type check
        run: pnpm exec tsc -p tsconfig.json --noEmit
      - name: Diff safety
        run: git diff --check
      - name: Commit verified A2 runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/audio src/speech.ts src/test-lab tests/audio-focus-manager.test.ts tests/pronunciation-mix-focus.test.ts tests/m22-audio-audit.test.ts tests/announcer-sfx.test.ts
          if git diff --cached --quiet; then
            echo "No A2 production changes to commit"
            exit 0
          fi
          git commit -m "feat(audio): centralize runtime focus and active-tail mixing"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
