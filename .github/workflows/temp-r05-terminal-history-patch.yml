name: Temporary R05 terminal history patch

on:
  push:
    branches:
      - automation/r05-terminal-history-wiring-20261011

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact terminal history wiring patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/main.ts")
          text = path.read_text()

          old_import_item = '  recordExpansionRun,\n'
          if text.count(old_import_item) != 1:
              raise SystemExit(f"expected exactly one recordExpansionRun import item, found {text.count(old_import_item)}")
          text = text.replace(old_import_item, '', 1)

          profile_import_end = '} from "./expansion-v2/profile-store";\n'
          if text.count(profile_import_end) != 1:
              raise SystemExit(f"expected exactly one profile-store import end, found {text.count(profile_import_end)}")
          text = text.replace(
              profile_import_end,
              profile_import_end + 'import { recordExpeditionHistoricalRun } from "./expansion-v2/expedition-history";\n',
              1,
          )

          old_call = '''  let next = recordExpansionRun(expansionV2Profile, {
            runId: run.runId,
            score: run.totalScore,
            completed: run.phase === "victory",
          });'''
          new_call = '  let next = recordExpeditionHistoricalRun(expansionV2Profile, run);'
          if text.count(old_call) != 1:
              raise SystemExit(f"expected exactly one legacy terminal history call, found {text.count(old_call)}")
          text = text.replace(old_call, new_call, 1)

          path.write_text(text)
          PY
          git diff --check
          test "$(git diff --numstat -- src/main.ts | awk '{print $3}')" = "src/main.ts"
          grep -F 'import { recordExpeditionHistoricalRun } from "./expansion-v2/expedition-history";' src/main.ts
          grep -F 'let next = recordExpeditionHistoricalRun(expansionV2Profile, run);' src/main.ts
          if grep -Fq '  recordExpansionRun,' src/main.ts; then
            echo 'legacy recordExpansionRun import still present' >&2
            exit 1
          fi
      - name: Commit patch on temporary branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.ts
          git commit -m "temp: wire enriched expedition terminal history [skip ci]"
          git push origin HEAD:${GITHUB_REF_NAME}
