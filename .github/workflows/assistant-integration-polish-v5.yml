name: Assistant integration polish v5

on:
  push:
    branches:
      - feat/bgv-integration-current

permissions:
  contents: write

concurrency:
  group: assistant-integration-polish-v5
  cancel-in-progress: false

jobs:
  polish:
    if: contains(github.event.head_commit.message, '[integration-v5]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/bgv-integration-current
          fetch-depth: 0
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.21.0 --activate
      - name: Repair WARP patch helper for current runtime
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("scripts/assistant-integration-polish.py")
          text = path.read_text()
          start = text.index("# 3) WARP UI ticks on aligned seconds; authoritative persistence remains 5-secondly.")
          end = text.index("# 4) Briefing is informational. Interactive route selection remains openRouteMap().", start)
          replacement = r'''# 3) WARP UI ticks on aligned seconds; authoritative persistence remains on the existing interval.
one(
    "src/ui/warp-hud.ts",
    "/** Pure display projection of already-reconciled account state, never a second wallet. */",
    ''' + "'''" + r'''/** Milliseconds until the next whole-second boundary. */
export function warpCountdownTickDelay(nowMs: number): number {
  const normalized = Math.max(0, Math.floor(nowMs));
  const remainder = normalized % 1000;
  return remainder === 0 ? 1000 : 1000 - remainder;
}

/** Pure display projection of already-reconciled account state, never a second wallet. */''' + "'''" + r''',
)
one(
    "src/main.ts",
    'import { warpHudView, warpRefuelView } from "./ui/warp-hud";',
    'import { warpCountdownTickDelay, warpHudView, warpRefuelView } from "./ui/warp-hud";',
)
one(
    "src/main.ts",
    "window.setInterval(() => {\n  renderWarpHud();",
    ''' + "'''" + r'''let warpCountdownTimer: number | null = null;
let warpCountdownStopped = false;
function scheduleWarpCountdownTick(): void {
  if (warpCountdownStopped) return;
  warpCountdownTimer = window.setTimeout(() => {
    if (warpCountdownStopped) return;
    renderWarpHud();
    scheduleWarpCountdownTick();
  }, warpCountdownTickDelay(Date.now()));
}
scheduleWarpCountdownTick();

const warpPersistenceInterval = window.setInterval(() => {''' + "'''" + r''',
)
window.addEventListener("pagehide", () => {
  warpCountdownStopped = true;
  if (warpCountdownTimer !== null) window.clearTimeout(warpCountdownTimer);
  window.clearInterval(warpPersistenceInterval);
}, { once: true });

'''
          path.write_text(text[:start] + replacement + text[end:])
          PY
      - name: Apply guarded patch
        run: python3 scripts/assistant-integration-polish.py
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test
        run: pnpm test
      - name: Typecheck
        run: pnpm exec tsc --noEmit
      - name: Build
        run: pnpm build
      - name: Commit validated source and cleanup helpers
        shell: bash
        run: |
          git config user.name "OpenAI integration worker"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/assistant-integration-polish.yml
          git rm .github/workflows/assistant-integration-polish-v2.yml
          git rm .github/workflows/assistant-integration-polish-v3.yml
          git rm .github/workflows/assistant-integration-polish-v4.yml
          git rm .github/workflows/assistant-integration-polish-v5.yml
          git rm scripts/assistant-integration-polish.py
          git add src index.html tests
          git commit -m "fix(integration): polish expedition warp briefing and audio"
          git push origin HEAD:feat/bgv-integration-current
