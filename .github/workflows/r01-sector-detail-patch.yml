name: R01 sector detail patch

on:
  push:
    branches:
      - feat/bgv-integration-current

permissions:
  contents: write

jobs:
  patch-test-push:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/bgv-integration-current
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install
        run: pnpm install --no-frozen-lockfile

      - name: Patch Journey Map sector model
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/campaign/journey-map.ts")
          text = path.read_text()
          old_type = """export type JourneySectorDetail = {
            startStage: number;
            endStage: number;
            checkpointStage: number;
            hiddenStops: JourneySecretNode[];
          };
          """
          new_type = """export type JourneySectorStage = {
            stage: number;
            role: ReturnType<typeof stageRole>;
            checkpoint: boolean;
          };

          export type JourneySectorDetail = {
            startStage: number;
            endStage: number;
            checkpointStage: number;
            stages: JourneySectorStage[];
            milestone: JourneySectorStage;
            restHub: {
              afterStage: number;
              label: "Checkpoint Rest Hub";
            };
            hiddenStops: JourneySecretNode[];
          };
          """
          if "export type JourneySectorStage" not in text:
              assert old_type in text
              text = text.replace(old_type, new_type, 1)

          function_start = text.index("export function journeySectorDetailForStage(")
          journey_path = text.index("\nexport function journeyPath(", function_start)
          function_text = text[function_start:journey_path]
          if "const stages = Array.from(" not in function_text:
              return_start = text.index("\n  return {", function_start, journey_path)
              function_close = text.rfind("\n}", return_start, journey_path)
              assert function_close > return_start
              replacement = """
            const stages = Array.from(
              { length: endStage - startStage + 1 },
              (_value, index): JourneySectorStage => {
                const current = startStage + index;
                return {
                  stage: current,
                  role: stageRole(current),
                  checkpoint: current === endStage,
                };
              },
            );
            const milestone = stages.at(-1);
            if (milestone === undefined) {
              throw new Error("Campaign sector must contain at least one stage.");
            }

            return {
              startStage,
              endStage,
              checkpointStage: endStage,
              stages,
              milestone,
              restHub: {
                afterStage: endStage,
                label: "Checkpoint Rest Hub",
              },
              hiddenStops,
            };
          """
              text = text[:return_start] + replacement.rstrip() + text[function_close:]

          path.write_text(text)
          PY

      - name: Patch Journey Map sector presentation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/ui/secret-route-map.ts")
          text = path.read_text()
          start = text.index("function renderSectorDetail(root: Document): void {")
          end = text.index("\nfunction isHiddenStopArrival", start)
          replacement = """function renderSectorDetail(root: Document): void {
            clearSectorDetail(root);
            const dialog = byId<HTMLDialogElement>(root, "stageSelectDialog");
            const grid = byId(root, "stageGrid");
            const parent = grid?.parentElement ?? null;
            const board = grid?.querySelector<HTMLElement>(".stage-journey") ?? null;
            if (dialog?.open !== true || grid === null || parent === null || board === null) {
              return;
            }

            const stage = selectedJourneyStage(board);
            if (stage === null) return;
            const detail = journeySectorDetailForStage(
              stage,
              currentHiddenDiscoveryPresentation(),
            );

            const panel = root.createElement("section");
            panel.id = SECTOR_DETAIL_ID;
            panel.className = "journey-sector-detail";
            panel.setAttribute("role", "region");
            panel.setAttribute("aria-labelledby", SECTOR_DETAIL_ID + "Title");

            const heading = root.createElement("div");
            heading.className = "journey-sector-heading";
            const eyebrow = root.createElement("small");
            eyebrow.textContent = "SECTOR DETAIL";
            const title = root.createElement("strong");
            title.id = SECTOR_DETAIL_ID + "Title";
            title.textContent =
              "Stages " + String(detail.startStage) + "–" + String(detail.endStage);
            const checkpoint = root.createElement("span");
            checkpoint.textContent =
              "Checkpoint · Stage " + String(detail.checkpointStage).padStart(3, "0");
            heading.append(eyebrow, title, checkpoint);

            const pathRail = root.createElement("div");
            pathRail.className = "journey-sector-path";
            pathRail.setAttribute(
              "aria-label",
              "Combat path · Stages " +
                String(detail.startStage) +
                " through " +
                String(detail.endStage),
            );
            for (const node of detail.stages) {
              const chip = root.createElement("span");
              chip.className = "journey-sector-stage journey-sector-stage-" + node.role;
              if (node.checkpoint) chip.classList.add("checkpoint");
              if (node.stage === stage) chip.classList.add("selected");
              const stageLabel = String(node.stage).padStart(3, "0");
              const roleLabel = node.role.replaceAll("-", " ");
              chip.textContent = stageLabel;
              chip.title = "Stage " + stageLabel + " · " + roleLabel;
              pathRail.append(chip);
            }

            const landmarks = root.createElement("div");
            landmarks.className = "journey-sector-landmarks";
            const milestone = root.createElement("span");
            milestone.className =
              "journey-sector-landmark journey-sector-landmark-boss";
            milestone.textContent =
              "MILESTONE · " +
              detail.milestone.role.replaceAll("-", " ").toUpperCase() +
              " · Stage " +
              String(detail.milestone.stage).padStart(3, "0");
            const restHub = root.createElement("span");
            restHub.className =
              "journey-sector-landmark journey-sector-landmark-rest";
            restHub.textContent =
              "REST HUB · after Stage " +
              String(detail.restHub.afterStage).padStart(3, "0");
            restHub.title =
              detail.restHub.label +
              " · Shop, Repair / Upgrade and Support Loadout after the checkpoint is saved.";
            landmarks.append(milestone, restHub);

            const stops = root.createElement("div");
            stops.className = "journey-sector-stops";
            if (detail.hiddenStops.length === 0) {
              const empty = root.createElement("span");
              empty.className = "journey-sector-empty";
              empty.textContent = "No hidden stops discovered in this sector.";
              stops.append(empty);
            } else {
              for (const stop of detail.hiddenStops) {
                stops.append(createSectorStopChip(root, stop));
              }
            }

            panel.append(heading, pathRail, landmarks, stops);
            parent.insertBefore(panel, grid);
          }
          """
          text = text[:start] + replacement.rstrip() + text[end:]
          text = text.replace(
              "\n\n\nexport function hiddenStopArrivalCanPresent(",
              "\n\nexport function hiddenStopArrivalCanPresent(",
          )
          path.write_text(text)
          PY

      - name: Patch Journey Map sector styles
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/ui/secret-route-map.css")
          text = path.read_text()
          detail_old = """.journey-sector-detail {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 18px;
          """
          detail_new = """.journey-sector-detail {
            display: grid;
            grid-template-columns: minmax(150px, auto) minmax(0, 1fr);
            align-items: start;
            gap: 10px 18px;
          """
          assert detail_old in text
          text = text.replace(detail_old, detail_new, 1)
          heading_old = """.journey-sector-heading {
            display: grid;
            flex: 0 0 auto;
            gap: 2px;
          }"""
          heading_new = """.journey-sector-heading {
            grid-column: 1;
            grid-row: 1 / span 3;
            display: grid;
            align-content: start;
            gap: 2px;
          }"""
          assert heading_old in text
          text = text.replace(heading_old, heading_new, 1)
          stops_old = ".journey-sector-stops {\n  display: flex;"
          stops_new = ".journey-sector-stops {\n  grid-column: 2;\n  display: flex;"
          assert stops_old in text
          text = text.replace(stops_old, stops_new, 1)

          additions = """
          .journey-sector-path {
            grid-column: 2;
            display: grid;
            grid-template-columns: repeat(10, minmax(34px, 1fr));
            gap: 5px;
            min-width: 0;
          }

          .journey-sector-stage {
            display: grid;
            place-items: center;
            min-height: 30px;
            padding: 4px;
            border: 1px solid rgba(159, 239, 255, 0.18);
            color: var(--holo-dim);
            background: rgba(5, 13, 26, 0.66);
            font-family: var(--holo-display);
            font-size: 0.66rem;
            font-weight: 800;
            letter-spacing: 0.04em;
          }

          .journey-sector-stage-elite,
          .journey-sector-stage-mini-boss,
          .journey-sector-stage-boss,
          .journey-sector-stage-major-boss {
            border-color: rgba(255, 190, 114, 0.48);
            color: #ffd49c;
          }

          .journey-sector-stage.checkpoint {
            box-shadow: inset 0 -2px 0 rgba(126, 255, 202, 0.72);
          }

          .journey-sector-stage.selected {
            border-color: #fff0b6;
            color: #ffffff;
            box-shadow: 0 0 0 2px rgba(255, 218, 124, 0.12);
          }

          .journey-sector-landmarks {
            grid-column: 2;
            display: flex;
            flex-wrap: wrap;
            gap: 7px;
          }

          .journey-sector-landmark {
            display: inline-flex;
            align-items: center;
            min-height: 28px;
            padding: 5px 8px;
            border: 1px solid rgba(159, 239, 255, 0.24);
            background: rgba(5, 13, 26, 0.72);
            font-size: 0.68rem;
            font-weight: 800;
            letter-spacing: 0.04em;
          }

          .journey-sector-landmark-boss {
            border-color: rgba(255, 190, 114, 0.5);
            color: #ffd49c;
          }

          .journey-sector-landmark-rest {
            border-color: rgba(126, 255, 202, 0.5);
            color: #8fffd2;
          }

          """
          media = text.index("@media (max-width:")
          text = text[:media] + additions + text[media:]

          media_old = """  .journey-sector-detail,
            .journey-secret-arrival {
              align-items: flex-start;
              flex-direction: column;
            }

            .journey-sector-stops,
            .journey-secret-arrival-actions {
          """
          media_new = """  .journey-sector-detail {
              grid-template-columns: 1fr;
              align-items: stretch;
            }

            .journey-sector-heading,
            .journey-sector-path,
            .journey-sector-landmarks,
            .journey-sector-stops {
              grid-column: 1;
              grid-row: auto;
            }

            .journey-sector-path {
              grid-template-columns: repeat(5, minmax(42px, 1fr));
            }

            .journey-secret-arrival {
              align-items: flex-start;
              flex-direction: column;
            }

            .journey-sector-stops,
            .journey-secret-arrival-actions {
          """
          assert media_old in text
          text = text.replace(media_old, media_new, 1)
          path.write_text(text)
          PY

      - name: Add sector detail regression coverage
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/journey-map.test.ts")
          text = path.read_text()
          anchor = '  it("merges only discovered hidden stops from the selected sector", () => {'
          assert anchor in text
          test = """  it("merges the ten-stage combat path, milestone boss and guaranteed Rest Hub", () => {
            const first = journeySectorDetailForStage(1, null);
            expect(first.stages.map((node) => node.stage)).toEqual(
              Array.from({ length: 10 }, (_value, index) => index + 1),
            );
            expect(first.stages.filter((node) => node.checkpoint)).toEqual([
              { stage: 10, role: "mini-boss", checkpoint: true },
            ]);
            expect(first.milestone).toEqual({
              stage: 10,
              role: "mini-boss",
              checkpoint: true,
            });
            expect(first.restHub).toEqual({
              afterStage: 10,
              label: "Checkpoint Rest Hub",
            });
            expect(journeySectorDetailForStage(20, null).milestone).toMatchObject({
              stage: 20,
              role: "boss",
            });
            expect(journeySectorDetailForStage(1000, null).milestone).toMatchObject({
              stage: 1000,
              role: "major-boss",
            });
          });

          """
          text = text.replace(anchor, test + anchor, 1)
          path.write_text(text)
          PY

      - name: Check patch diff
        run: |
          git diff --check
          grep -q "const stages = Array.from" src/campaign/journey-map.ts
          grep -q "journey-sector-landmark-rest" src/ui/secret-route-map.ts
          grep -q "repeat(5, minmax(42px, 1fr))" src/ui/secret-route-map.css
          git diff -- src/campaign/journey-map.ts src/ui/secret-route-map.ts src/ui/secret-route-map.css tests/journey-map.test.ts
      - name: Targeted R01 tests
        run: pnpm exec vitest run tests/journey-map.test.ts tests/secret-route.test.ts tests/hidden-discovery-timing.test.ts
      - name: Full test
        run: pnpm test
      - name: Build and typecheck
        run: pnpm build
      - name: Commit and push R01 sector detail
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/campaign/journey-map.ts src/ui/secret-route-map.ts src/ui/secret-route-map.css tests/journey-map.test.ts
          git commit -m "feat(campaign): complete Journey Map sector detail"
          git push origin HEAD:feat/bgv-integration-current
