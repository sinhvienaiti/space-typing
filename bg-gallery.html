<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Space Typing — Background gallery (dev)</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; color: #dfe9f5; font: 12px/1.4 ui-monospace, Menlo, monospace; overflow: hidden; }
      #grid { position: absolute; inset: 0; display: grid; gap: 2px; }
      .cell { position: relative; overflow: hidden; background: #05080f; }
      .cell canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      .cell .label { position: absolute; left: 8px; top: 6px; padding: 2px 6px; background: rgba(0,0,0,.55); border-radius: 4px; pointer-events: none; }
      #panel { position: absolute; right: 10px; top: 10px; z-index: 2; display: grid; gap: 6px; padding: 10px; background: rgba(6,10,18,.82); border: 1px solid rgba(120,170,230,.2); border-radius: 8px; min-width: 250px; }
      #panel.hidden { display: none; }
      #panel label { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
      #panel button, #panel select, #panel input { font: inherit; color: inherit; background: #111a28; border: 1px solid #2a3a52; border-radius: 5px; padding: 3px 6px; }
      #stats { white-space: pre; color: #9fb4cc; }
    </style>
  </head>
  <body>
    <div id="grid"></div>
    <div id="panel">
      <label>World <select id="world"></select></label>
      <label>Quality
        <select id="quality">
          <option>low</option><option>medium</option><option selected>high</option><option>ultra</option>
        </select>
      </label>
      <label>Time scale <input id="timeScale" type="range" min="0" max="4" step="0.25" value="1" /></label>
      <label>Grid (all Worlds) <input id="gridToggle" type="checkbox" /></label>
      <label>Mock word labels <input id="labels" type="checkbox" /></label>
      <button id="shower" type="button">Trigger meteor shower</button>
      <button id="pass" type="button">Trigger pass (creature / ship)</button>
      <div id="stats"></div>
      <div>H: hide panel</div>
    </div>
    <script type="module" src="/src/background/gallery.ts"></script>
  </body>
</html>
