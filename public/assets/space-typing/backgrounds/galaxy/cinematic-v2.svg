<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="space" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#01040d"/>
      <stop offset=".36" stop-color="#071028"/>
      <stop offset=".68" stop-color="#09061d"/>
      <stop offset="1" stop-color="#02030a"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#6d2ed7" stop-opacity="0"/>
      <stop offset=".22" stop-color="#a54cff" stop-opacity=".42"/>
      <stop offset=".52" stop-color="#4d8cff" stop-opacity=".58"/>
      <stop offset=".78" stop-color="#5cecff" stop-opacity=".36"/>
      <stop offset="1" stop-color="#8ef6ff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="cyanGlow">
      <stop offset="0" stop-color="#75f4ff" stop-opacity=".42"/>
      <stop offset=".28" stop-color="#3d9dff" stop-opacity=".22"/>
      <stop offset=".68" stop-color="#2252b8" stop-opacity=".07"/>
      <stop offset="1" stop-color="#071028" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violetGlow">
      <stop offset="0" stop-color="#c86dff" stop-opacity=".36"/>
      <stop offset=".38" stop-color="#7e36e7" stop-opacity=".2"/>
      <stop offset=".76" stop-color="#341579" stop-opacity=".05"/>
      <stop offset="1" stop-color="#05020c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="warmGlow">
      <stop offset="0" stop-color="#ffe5ae" stop-opacity=".28"/>
      <stop offset=".18" stop-color="#d996ff" stop-opacity=".17"/>
      <stop offset=".62" stop-color="#7148c8" stop-opacity=".05"/>
      <stop offset="1" stop-color="#05020c" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft40" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <filter id="soft18" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="starGlow" x="-400%" y="-400%" width="900%" height="900%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="cloudNoise" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency=".0035 .008" numOctaves="4" seed="37" result="n"/>
      <feColorMatrix in="n" type="matrix" values="
        1.1 0 0 0 -.18
        0 1.0 0 0 -.25
        0 0 1.3 0 -.05
        0 0 0 1 0" result="c"/>
      <feGaussianBlur in="c" stdDeviation="7" result="blur"/>
      <feBlend in="SourceGraphic" in2="blur" mode="screen"/>
    </filter>
    <filter id="dustNoise" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency=".006 .018" numOctaves="3" seed="11" result="n"/>
      <feColorMatrix in="n" type="matrix" values="
        .35 0 0 0 0
        0 .22 0 0 0
        0 0 .5 0 0
        0 0 0 .7 0"/>
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#space)"/>

  <!-- Large-scale luminous masses. -->
  <ellipse cx="1190" cy="360" rx="560" ry="310" fill="url(#cyanGlow)" filter="url(#soft40)"/>
  <ellipse cx="630" cy="620" rx="660" ry="300" fill="url(#violetGlow)" filter="url(#soft40)"/>
  <ellipse cx="1120" cy="190" rx="250" ry="150" fill="url(#warmGlow)" filter="url(#soft18)"/>

  <!-- Main diagonal nebula ribbon, intentionally crossing the outer thirds while
       leaving the central typing corridor darker. -->
  <path d="M-180 830 C220 690 440 620 700 520 C1010 402 1180 260 1780 40"
        fill="none" stroke="url(#ribbon)" stroke-width="180" stroke-linecap="round"
        opacity=".62" filter="url(#cloudNoise)"/>
  <path d="M-160 810 C260 700 480 615 720 500 C1010 360 1260 210 1760 20"
        fill="none" stroke="#6bdfff" stroke-opacity=".13" stroke-width="34"
        stroke-linecap="round" filter="url(#soft18)"/>

  <!-- Dark dust lane adds real depth instead of a uniformly bright wallpaper. -->
  <path d="M-120 730 C300 650 560 560 800 445 C1040 332 1290 205 1710 80"
        fill="none" stroke="#00020a" stroke-opacity=".56" stroke-width="76"
        stroke-linecap="round" filter="url(#soft18)"/>

  <!-- Fine irregular gas texture, kept subtle and away from the HUD edges. -->
  <rect x="140" y="90" width="1320" height="690" opacity=".16" filter="url(#dustNoise)"
        fill="#6f65dd"/>

  <!-- Authored sparse stars: varied scale, no repeating texture. -->
  <g fill="#dff9ff">
    <circle cx="86" cy="104" r="1.2"/><circle cx="132" cy="178" r=".8"/>
    <circle cx="188" cy="84" r=".7"/><circle cx="255" cy="214" r="1.1"/>
    <circle cx="326" cy="128" r=".6"/><circle cx="392" cy="266" r=".9"/>
    <circle cx="482" cy="104" r=".7"/><circle cx="562" cy="210" r=".7"/>
    <circle cx="1018" cy="126" r=".8"/><circle cx="1082" cy="226" r="1.1"/>
    <circle cx="1160" cy="104" r=".6"/><circle cx="1238" cy="182" r=".8"/>
    <circle cx="1328" cy="108" r=".7"/><circle cx="1422" cy="214" r="1.1"/>
    <circle cx="1510" cy="136" r=".7"/><circle cx="1536" cy="332" r=".9"/>
    <circle cx="78" cy="438" r=".8"/><circle cx="164" cy="548" r="1"/>
    <circle cx="276" cy="492" r=".6"/><circle cx="388" cy="606" r=".8"/>
    <circle cx="1180" cy="512" r=".8"/><circle cx="1266" cy="620" r=".7"/>
    <circle cx="1378" cy="548" r="1"/><circle cx="1492" cy="676" r=".7"/>
    <circle cx="104" cy="742" r=".8"/><circle cx="248" cy="806" r=".6"/>
    <circle cx="1342" cy="788" r=".7"/><circle cx="1518" cy="754" r=".8"/>
  </g>

  <!-- A few rare bright stars provide hierarchy rather than noise. -->
  <g fill="#ffffff" filter="url(#starGlow)">
    <circle cx="294" cy="332" r="2.2"/>
    <circle cx="1114" cy="170" r="2.5"/>
    <circle cx="1320" cy="430" r="2"/>
    <circle cx="430" cy="720" r="1.8"/>
  </g>
</svg>